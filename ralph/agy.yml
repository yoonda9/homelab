# Ralph Orchestrator Configuration
# Generated by: ralph init --backend custom
# Docs: https://github.com/mikeyobrien/ralph-orchestrator

cli:
  backend: "custom"
  command: "agy"
  args: ["--dangerously-skip-permissions", "--print-timeout", "60m", "--output-format", "stream-json"]
  prompt_type: "flag"
  prompt_flag: "-p"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 150
  max_runtime_seconds: 28800    # 8 hours max

