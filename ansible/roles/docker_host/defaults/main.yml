---
# docker_host role defaults (design §4.3/§4.4). Override per group/host.

# Compose project directory on CT 111 (holds compose.yml + Traefik config).
docker_host_project_dir: /opt/stack

# Docker CE + the compose plugin are installed by the geerlingguy.docker meta
# dependency (see meta/main.yml); package selection lives in that role's vars.

# Container images for the smoke stack.
docker_host_traefik_image: traefik:v3.7.5
docker_host_whoami_image: traefik/whoami:v1.11.0

# Internal-only extras stack images (Step 10). All LAN/Tailscale-only, routed by
# Traefik docker labels (no published host port) and gated by internal-allowlist@file.
docker_host_homepage_image: ghcr.io/gethomepage/homepage:v1.13.2
docker_host_uptime_kuma_image: louislam/uptime-kuma:2.4.0
docker_host_grafana_image: grafana/grafana:13.1.0
docker_host_prometheus_image: prom/prometheus:v3.12.0
# Prometheus scrape targets (never routed/exposed — no Traefik labels).
docker_host_node_exporter_image: prom/node-exporter:v1.11.1
docker_host_cadvisor_image: gcr.io/cadvisor/cadvisor:v0.55.1
docker_host_pve_exporter_image: prompve/prometheus-pve-exporter:3.9.0
# Plex Media Server exporter (plex-monitoring Step 3). Verified against the
# registry rather than off a research doc: the ghcr tag list carries 1.0.0,
# 1.1.2, 1.1.3, 2.0.0, 2.1.0 and latest (plus 45 commit-sha tags), and 2.1.0
# resolves to an OCI index (sha256:ab89d0ba039e...) with a linux/amd64 manifest.
# The runner-up jsclayton/prometheus-plex-exporter publishes ONLY latest and
# main — no version tag exists, so it cannot satisfy
# test_no_floating_service_image_tags without a digest pin, and that is what
# decided the choice. Staleness recorded rather than discovered later: MIT, not
# archived, last release AND last push both 2024-12-22.
docker_host_plex_exporter_image: ghcr.io/axsuul/plex-media-server-exporter:2.1.0
# Synthetic probes (plex-blip-manual-triage Step 5). Verified against the
# registry the same way as the exporter above rather than taken from a research
# doc: v0.28.0 (2025-12-06) is the newest release tag Docker Hub carries for
# prom/blackbox-exporter and it is the tag `latest` currently points at — the
# three floating `master*` tags are the only newer things published, and they are
# not releases. Three-part pin, per test_no_floating_service_image_tags.
#
# THIS IMAGE RUNS AS ROOT, WHICH IS NOT TRUE OF ITS SIBLINGS AND DECIDES A MODE.
# `docker inspect` reports `Config.User` "" here against "nobody" for
# prom/prometheus:v3.12.0, and `id` in each confirms it (uid 0 vs uid 65534) —
# so the rendered blackbox.yml is 0640 root:root, readable to the process and
# published to nobody, while prometheus.yml two files over must stay 0644 for the
# opposite and equally measured reason (tasks/main.yml).
docker_host_blackbox_exporter_image: prom/blackbox-exporter:v0.28.0

# Proxmox VE exporter coordinates (plex-monitoring Step 2). All NON-SECRET, so
# they live here rather than in the vault — only the token VALUE is a secret and
# it comes from vault_pve_api_token via env.j2. The API host is the same
# endpoint mise.toml already commits as PROXMOX_VE_ENDPOINT; the shape guard
# asserts the two agree instead of pinning the address twice.
docker_host_pve_api_host: 192.168.1.50
# The user MUST carry its realm. Measured, because the same sentence used to
# assert a status code the operator never sees: PVE answers `401 Unauthorized`
# to a realm-less token, the exporter raises `proxmoxer.core.ResourceException`
# and turns it into HTTP 500 for the scrape — so Prometheus shows the SAME
# lastError as a missing token, and the realm is only visible in the exporter's
# own `docker logs` (logs/calibration-step02a-f3.log, C).
# Created with role PVEAuditor at / (propagate) in Step 2b.
docker_host_pve_user: prometheus@pve
# The token ID the operator mints under that user; the exporter sends
# `PVEAPIToken=<user>!<name>=<value>`, so this must match the minted ID exactly.
docker_host_pve_token_name: prometheus

# Cloudflare Tunnel connector (Step 4). Concrete pin, live-verified real/current
# on Docker Hub (2026-07-14: current `latest`, multi-arch). Outbound-only — the
# service publishes no ports; TUNNEL_TOKEN comes from the vault via env.j2.
docker_host_cloudflared_image: cloudflare/cloudflared:2026.7.1

# Plex CT (110) backend for the public file-provider router (Step 9). Plex does
# not run in Docker, so Traefik reaches it over the LAN at this address.
docker_host_plex_url: http://192.168.1.110:32400

# ACME registration email (Let's Encrypt). Overridable per environment.
docker_host_acme_email: "admin@{{ domain }}"

# Production ACME store reset (Step 7). OFF by default so ordinary runs never
# wipe live certs. Set true (`-e docker_host_acme_reset=true`) for the one-shot
# staging->prod cutover: it stops Traefik, empties acme.json at 0600, and starts
# Traefik so the wildcard re-issues from LE prod (a caServer flip alone reuses the
# staging cert — acme.json is keyed by resolver name).
docker_host_acme_reset: false

# No dashboard host port: the Traefik API/dashboard is served only via the routed
# api@internal service behind the traefik-dashboard router (dynamic.yml.j2), not an
# insecure :8080 entrypoint (design §6). Reachable on the LAN/Tailscale at
# https://traefik.{{ domain }} through internal-allowlist.
