---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload systemd for gitlab-runner
  ansible.builtin.systemd:
    daemon_reload: true

# Drain and restart docker: one notify name, four handlers run in file order.
# gitlab-runner is stopped (SIGQUIT drain via the Step 5 drop-in) before docker
# restarts so no job is killed; stop/start are skipped while the unit does not
# exist yet (Steps 3-4 run before the package is installed).
- name: Drain and restart docker
  ansible.builtin.command: systemctl cat gitlab-runner.service  # noqa: command-instead-of-module
  register: gitlab_runner_unit_probe
  changed_when: false
  failed_when: false

- name: Stop gitlab-runner before the docker restart
  ansible.builtin.systemd:
    name: gitlab-runner
    state: stopped
  when: gitlab_runner_unit_probe.rc == 0
  listen: Drain and restart docker

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  listen: Drain and restart docker

- name: Start gitlab-runner after the docker restart
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
  when: gitlab_runner_unit_probe.rc == 0
  listen: Drain and restart docker

# Drains first once the Step 5 drop-in (KillSignal=SIGQUIT) is in place.
- name: Restart gitlab-runner
  ansible.builtin.systemd:
    name: gitlab-runner
    state: restarted

- name: Reload systemd for ci-egress
  ansible.builtin.systemd:
    daemon_reload: true

# oneshot + RemainAfterExit: restart re-runs nft -f, replacing the table.
# Runs after the daemon-reload handler above (file order), so a first run finds the unit.
- name: Reload ci-egress
  ansible.builtin.systemd:
    name: ci-egress
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system  # noqa: command-instead-of-module
  changed_when: true

- name: Reload systemd for prune
  ansible.builtin.systemd:
    daemon_reload: true

# A restart does not touch jobs, so no drain.
- name: Restart docuum
  ansible.builtin.systemd:
    name: docuum
    state: restarted
