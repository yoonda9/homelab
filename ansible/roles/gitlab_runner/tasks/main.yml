---
- name: Harden the VM
  ansible.builtin.import_tasks: harden.yml

- name: Fence egress
  ansible.builtin.import_tasks: firewall.yml

- name: Configure Docker
  ansible.builtin.import_tasks: docker.yml

- name: Install gitlab-runner
  ansible.builtin.import_tasks: install.yml

- name: Install the drain drop-in
  ansible.builtin.import_tasks: drain.yml

- name: Upgrade gitlab-runner behind a drain
  ansible.builtin.import_tasks: upgrade.yml

- name: Configure gitlab-runner
  ansible.builtin.import_tasks: config.yml

- name: Install the DinD-TLS smoke script
  ansible.builtin.import_tasks: smoke.yml

- name: Install the prune timer and Docuum
  ansible.builtin.import_tasks: prune.yml
