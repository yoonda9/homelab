---
- name: Install the sshd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
    content: |
      # Managed by Ansible (roles/gitlab_runner). Sorts first, so it wins.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Remove the cloud-init sshd drop-in that re-enables passwords
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart ssh

- name: Lock the admin user's password
  ansible.builtin.user:
    name: "{{ gitlab_runner_admin_user }}"
    password_lock: true

- name: Check whether needrestart is installed
  ansible.builtin.stat:
    path: /usr/sbin/needrestart
  register: gitlab_runner_needrestart_bin

- name: Exclude docker, containerd and gitlab-runner from needrestart
  ansible.builtin.template:
    src: needrestart.conf.j2
    dest: /etc/needrestart/conf.d/50-gitlab-runner.conf
    owner: root
    group: root
    mode: "0644"
  when: gitlab_runner_needrestart_bin.stat.exists
