---
galaxy_info:
  role_name: gitlab_runner
  namespace: homelab
  author: homelab maintainers
  description: Self-hosted GitLab runner VM (hardening, Docker, gitlab-runner).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - resolute
  galaxy_tags:
    - homelab
    - gitlab
# geerlingguy.docker runs before this role's tasks. It must not own daemon.json
# (docker_daemon_options stays empty) nor restart dockerd on its own: this role
# templates daemon.json and changes go through the drain handler.
dependencies:
  - role: geerlingguy.docker
    docker_packages_state: present
    docker_daemon_options: {}
    docker_restart_handler_state: started
    docker_users: []
