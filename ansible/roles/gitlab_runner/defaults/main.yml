---
# Admin account created by cloud-init; its password is locked, key auth only (R20).
gitlab_runner_admin_user: user

# Units needrestart must never restart on its own: a restart mid-job kills it (R28).
gitlab_runner_needrestart_excluded_units:
  - docker
  - containerd
  - gitlab-runner

# config.toml (§4.4). Runners are declared in group_vars/gitlab_runner/vars.yml;
# an empty list renders zero [[runners]] (R13).
gitlab_runner_runners: []
gitlab_runner_runners_here: "{{ gitlab_runner_runners | selectattr('host', 'equalto', inventory_hostname) | list }}"
gitlab_runner_url: https://gitlab.com
gitlab_runner_concurrent: 4
gitlab_runner_check_interval: 3
gitlab_runner_listen_port: 9252
gitlab_runner_default_image: alpine:3.22
gitlab_runner_shm_size: 2147483648
gitlab_runner_request_concurrency: 2
# Named volumes only: a host bind would expose the VM to jobs.
gitlab_runner_volumes: ["/certs/client", "/cache"]
# Matched against the service name as the job writes it in .gitlab-ci.yml.
gitlab_runner_privileged_services: ["docker:*-dind"]
gitlab_runner_pull_policy: ["if-not-present"]
gitlab_runner_allowed_pull_policies: ["always", "if-not-present"]

# Drain (R16): systemd waits this long for running jobs after SIGQUIT. Must exceed
# the max job timeout (5400-5700 s) plus after_script and artifact upload.
gitlab_runner_drain_timeout_sec: 6000

# DinD-TLS smoke (D2): default docker image tag for /usr/local/sbin/dind-tls-smoke.
# `just runner-smoke 27` overrides it per run.
gitlab_runner_smoke_tag: "29"

# In-VM egress fence (R19, §4.6): LAN is unreachable except DNS on the gateway;
# the metrics ports (9100, gitlab_runner_listen_port) answer these sources and loopback only.
gitlab_runner_lan_cidr: 192.168.1.0/24
gitlab_runner_lan_gateway: 192.168.1.1
gitlab_runner_metrics_allowed_from: ["192.168.1.111"]

# Upkeep (R15, §4.7). prune_keep feeds `--filter until=` on containers, builder cache and networks.
gitlab_runner_prune_keep: 168h
gitlab_runner_prune_on_calendar: "*-*-* 04:00:00"
# Docuum evicts images least-recently-used first. Exact pin; an upgrade is a version + sha bump.
gitlab_runner_docuum_version: "0.27.3"
# Provenance: the GitHub release API publishes `digest: sha256:...` for the
# docuum-x86_64-unknown-linux-musl asset (checked 2026-11-09, and recomputed from the downloaded file).
gitlab_runner_docuum_sha256: "1c85c2b2341470ff4d631e33a56b4b86793c8250bd7b9e8efba3f8ba3cad518b"
gitlab_runner_docuum_threshold: "60%"
gitlab_runner_docuum_min_age: "1d"
